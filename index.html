<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sharo28 - Mobile Apps & Development</title>
  <style>
    :root {
      --bg: #0a0b0d;
      --card-bg: #14171c;
      --border: #252a34;
      --text: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #38bdf8;
      --accent-dim: rgba(56, 189, 248, 0.12);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8fafc;
        --card-bg: #ffffff;
        --border: #e2e8f0;
        --text: #0f172a;
        --text-sub: #64748b;
        --accent: #0284c7;
        --accent-dim: rgba(2, 132, 199, 0.08);
      }
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 48px 16px;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 40px;
      text-align: center;
    }
    h1 {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    .tagline {
      color: var(--text-sub);
      font-size: 15px;
    }
    .section-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .app-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      display: flex;
      gap: 20px;
      align-items: center;
      transition: border-color 0.2s;
    }
    .app-card:hover {
      border-color: var(--accent);
    }
    .app-icon-dummy {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      background: linear-gradient(135deg, #1e232b 0%, #0d0f12 100%);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-weight: bold;
      font-size: 20px;
      flex-shrink: 0;
    }
    .app-info {
      flex: 1;
    }
    .app-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .app-desc {
      font-size: 14px;
      color: var(--text-sub);
      margin-bottom: 10px;
    }
    .app-links {
      display: flex;
      gap: 12px;
      font-size: 13px;
    }
    .app-links a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }
    .app-links a:hover {
      text-decoration: underline;
    }
    .support-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-top: 32px;
    }
    .support-card h2 {
      font-size: 16px;
      margin-bottom: 8px;
    }
    .support-card p {
      font-size: 14px;
      color: var(--text-sub);
    }
    footer {
      text-align: center;
      margin-top: 48px;
      color: var(--text-sub);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>sharo28 Apps</h1>
      <p class="tagline">iOS Utility & Productivity Applications</p>
    </header>

    <div class="section-title">Published Applications</div>

    <div class="app-card">
      <div class="app-icon-dummy">E</div>
      <div class="app-info">
        <div class="app-title">E-scale (思考のスナップ定規)</div>
        <div class="app-desc">キリの良い納得感のある数値を指先ひとつで決定するプロ向けスナップ定規ツール。</div>
        <div class="app-links">
          <a href="./e-scale/privacy.html">プライバシーポリシー</a>
        </div>
      </div>
    </div>

    <div class="support-card">
      <h2>サポート・お問い合わせ (Support)</h2>
      <p>アプリの不具合報告や機能のご要望は、<a href="https://github.com/sharo28" target="_blank" rel="noopener noreferrer" style="color: var(--accent);">GitHub Profile</a> または各リポジトリの Issue よりご連絡ください。</p>
    </div>

    <footer>
      <p>&copy; 2026 sharo28. All rights reserved.</p>
    </footer>
  </div>
</body>
</html>
